app = "ion-ditto-api"
primary_region = "sjc"
kill_signal = "SIGTERM"
kill_timeout = "30s"
[build]
  dockerfile = "../../docker/api.Dockerfile"
[env]
  NODE_ENV = "production"
  PORT = "8787"
[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  [[http_service.checks]]
    grace_period = "60s"
    interval = "15s"
    method = "GET"
    timeout = "10s"
    path = "/healthz"
[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory = "2gb"
[[restart]]
  policy = "always"
